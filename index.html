<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earnings Calendar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070b10;
  --bg2:#0c1219;
  --card:#101820;
  --line:#2a3b4e;
  --line2:#243140;
  --text:#f4f7fb;
  --muted:#c2cddc;
  --dim:#9aa9bb;
  --hold:#8cc8ff;
  --hold-bg:#0d243c;
  --watch:#d0d7e2;
  --watch-bg:#1a222c;
  --bp:#ff8fb3;
  --bp-bg:#2a121c;
  --bmo:#5eead4;
  --bmo-bg:#0f2a28;
  --amc:#c4b5fd;
  --amc-bg:#22183a;
  --today:#3dff9a;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
html{font-size:18px;background:var(--bg);color:var(--text)}
body{font-family:var(--sans);min-height:100vh;background:var(--bg);color:var(--text)}
.page-header{background:var(--bg2);color:var(--text);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.page-header h1{font-size:1.28rem;font-weight:700;letter-spacing:0.02em;font-family:var(--mono)}
.updated-badge{background:transparent;border:1px solid var(--line);border-radius:4px;padding:6px 12px;font-size:0.78rem;color:var(--muted);white-space:nowrap;flex-shrink:0;font-family:var(--mono)}
.new-badge{display:inline-flex;align-items:center;background:#10261a;color:var(--today);font-size:0.58rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:1px 5px;border-radius:3px;margin-left:6px;vertical-align:middle;font-family:var(--mono);border:1px solid #1f5c3a}
.main{max-width:1280px;margin:0 auto;padding:24px 22px}
.panels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;align-items:start}
.panel{background:var(--card);border-radius:6px;border:1px solid var(--line);overflow:hidden}
.panel-header{padding:9px 14px;border-bottom:1px solid var(--line);background:var(--bg2)}
.panel-label{font-size:0.74rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:2px 8px;border-radius:3px;display:inline-block;font-family:var(--mono)}
.panel-label.holdings{background:var(--hold-bg);color:var(--hold);border:1px solid #1a4a72}
.panel-label.bullpen{background:var(--bp-bg);color:var(--bp);border:1px solid #5a2238}
.panel-label.watchlist{background:var(--watch-bg);color:var(--watch);border:1px solid var(--line2)}
.entry{padding:10px 14px;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:none}
.entry-ticker{font-weight:700;font-size:1.08rem;letter-spacing:0.04em;color:var(--text);font-family:var(--mono)}
.entry-company{font-size:0.78rem;color:var(--muted);margin-top:1px;margin-bottom:7px}
.entry-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:5px}
.entry-date{font-weight:600;font-size:0.92rem;color:var(--text);white-space:nowrap;font-family:var(--mono)}
.entry-time{font-size:0.88rem;color:var(--muted);white-space:nowrap;font-family:var(--mono)}
.sess{display:inline-block;padding:2px 7px;border-radius:3px;font-size:0.7rem;font-weight:700;letter-spacing:0.04em;white-space:nowrap;font-family:var(--mono)}
.sess.bmo{background:var(--bmo-bg);color:var(--bmo)}
.sess.amc{background:var(--amc-bg);color:var(--amc)}
.entry-notes{font-size:0.76rem;color:var(--muted);line-height:1.45}
.empty-panel{padding:18px 14px;text-align:center;font-size:0.74rem;color:var(--dim);font-style:italic}
.na-section{background:var(--card);border-radius:6px;border:1px solid var(--line);overflow:hidden}
.na-header{padding:9px 16px;border-bottom:1px solid var(--line);font-size:0.74rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim);font-family:var(--mono);background:var(--bg2)}
.na-grid{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px}
.na-chip{background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:7px 10px;min-width:78px}
.na-chip .sym{font-weight:700;font-size:0.92rem;color:var(--text);font-family:var(--mono);letter-spacing:0.04em}
.na-chip .co{font-size:0.72rem;color:var(--muted);margin-top:2px}
.na-chip .cat{font-size:0.66rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-top:3px;font-family:var(--mono)}
.na-chip .cat.h{color:var(--hold)}
.na-chip .cat.w{color:var(--watch)}
.na-chip .cat.b{color:var(--bp)}
.footer{text-align:center;font-size:0.78rem;color:var(--muted);margin-top:18px;padding-bottom:28px;line-height:1.6}
.footer p{margin:0}
.footer p+p{margin-top:4px}
.header-actions{display:flex;align-items:center;gap:10px}
.export-link{background:none;border:none;padding:0;color:var(--muted);font:inherit;font-size:0.78rem;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.export-link:hover{color:var(--text)}
.export-link:disabled{opacity:0.6;cursor:default}
.view-toggle{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex-shrink:0}
.view-btn{background:transparent;border:none;color:var(--muted);font-size:0.82rem;font-weight:600;padding:8px 14px;cursor:pointer;white-space:nowrap;transition:background 0.15s,color 0.15s;font-family:var(--mono);letter-spacing:0.04em;text-transform:uppercase}
.view-btn:not(:last-child){border-right:1px solid var(--line)}
.view-btn:hover{background:var(--card);color:var(--text)}
.view-btn.active{background:var(--hold-bg);color:var(--hold)}
#calendarView{margin-bottom:4px}
.cal-card{background:var(--card);border-radius:6px;border:1px solid var(--line);overflow:hidden}
.cal-toolbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg2)}
.cal-month-cluster{display:flex;align-items:center;gap:10px;grid-column:2;justify-self:center}
.cal-nav-group{display:inline-flex;gap:4px;flex-shrink:0}
.cal-nav{background:var(--card);border:1px solid var(--line);color:var(--text);font-size:1.15rem;font-weight:600;width:34px;height:34px;border-radius:4px;cursor:pointer;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.cal-nav:hover{background:var(--line)}
.cal-month-label{font-size:1.15rem;font-weight:650;letter-spacing:0.06em;color:var(--text);font-family:var(--mono);text-transform:uppercase;white-space:nowrap}
.cal-today-btn{grid-column:3;justify-self:end;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:0.78rem;font-weight:600;padding:5px 10px;border-radius:4px;cursor:pointer;font-family:var(--mono);letter-spacing:0.06em;text-transform:uppercase}
.cal-today-btn:hover{background:var(--line);color:var(--text)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--bg)}
.cal-dow{font-size:0.74rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim);text-align:center;padding:7px 4px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-family:var(--mono);background:var(--bg2)}
.cal-dow:nth-child(7n),.cal-cell:nth-child(7n){border-right:none}
.cal-cell{min-height:92px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 4px 7px;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--card)}
.cal-cell.muted{background:var(--bg2)}
.cal-cell.muted .cal-daynum{color:var(--dim)}
.cal-daynum{font-size:0.82rem;font-weight:600;color:var(--muted);width:22px;height:22px;line-height:22px;text-align:center;flex-shrink:0;font-family:var(--mono)}
.cal-cell.today .cal-daynum{background:var(--today);color:#04110a;border-radius:3px}
.cal-event{font-size:0.78rem;font-weight:700;padding:2px 5px;border-radius:2px;line-height:1.3;overflow:hidden;min-width:0;white-space:nowrap;text-overflow:ellipsis;font-family:var(--mono);letter-spacing:0.02em}
.cal-event.holdings{background:var(--hold-bg);color:var(--hold);border-left:2px solid var(--hold)}
.cal-event.watchlist{background:var(--watch-bg);color:var(--watch);border-left:2px solid var(--watch)}
.cal-event.bullpen{background:var(--bp-bg);color:var(--bp);border-left:2px solid var(--bp)}
.cal-event .t{margin-right:4px}
.cal-event .tm{font-weight:600;opacity:0.85}
@media(max-width:900px){
.panels{grid-template-columns:1fr}
.page-header{padding:12px 14px;flex-wrap:wrap}
.main{padding:14px 10px}
.cal-cell{min-height:70px;padding:4px 3px 6px}
.cal-event{font-size:0.7rem;padding:2px 4px;white-space:normal}
.cal-month-label{font-size:0.95rem}
.cal-toolbar{padding:8px 10px}
.cal-dow{font-size:0.56rem;padding:6px 2px}
.view-btn{padding:7px 9px;font-size:0.66rem}
}
</style>
</head>
<body>
<div class="page-header">
  <h1>Earnings Calendar</h1>
  <div class="header-actions">
    <div class="view-toggle" role="group" aria-label="View">
      <button type="button" id="calViewBtn" class="view-btn active">Calendar</button>
      <button type="button" id="listViewBtn" class="view-btn">List</button>
    </div>
    <div id="updatedBadge" class="updated-badge">Updated: —</div>
  </div>
</div>
<div class="main">
  <div id="listView" hidden>
    <div class="panels">
      <div class="panel"><div class="panel-header"><span class="panel-label holdings">Holdings</span></div><div id="holdingsBody"></div></div>
      <div class="panel"><div class="panel-header"><span class="panel-label watchlist">Bullpen</span></div><div id="watchlistBody"></div></div>
      <div class="panel"><div class="panel-header"><span class="panel-label bullpen">Zane's Bullpen</span></div><div id="bullpenBody"></div></div>
    </div>
    <div class="na-section"><div class="na-header">Not Announced</div><div class="na-grid" id="naGrid"></div></div>
  </div>
  <div id="calendarView">
    <div class="cal-card">
      <div class="cal-toolbar">
        <div class="cal-month-cluster">
          <div class="cal-month-label" id="calMonthLabel"></div>
          <div class="cal-nav-group">
            <button type="button" class="cal-nav" id="calPrev" aria-label="Previous month">&lsaquo;</button>
            <button type="button" class="cal-nav" id="calNext" aria-label="Next month">&rsaquo;</button>
          </div>
        </div>
        <button type="button" class="cal-today-btn" id="calToday">Today</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>
  <div class="footer">
    <p><button type="button" id="exportBtn" class="export-link" onclick="exportChecklist()">Download checklist (Excel)</button></p>
    <p><strong>Confirmed</strong> dates require both date AND time from the company's official IR page or press release only.</p>
    <p>* Results released after market close the prior day. Date and time shown are the conference call.</p>
  </div>
</div>
<script>
const EARNINGS = [
  // HOLDINGS
  { cat:'holdings', ticker:'TXN', co:'Texas Instruments', date:'2026-07-22', timeCT:'3:30 PM', sess:'AMC', status:'confirmed', notes:'Source: prnewswire.com / investor.ti.com (CFO transition press release), June 2, 2026' },
  { cat:'holdings', ticker:'TMO', co:'Thermo Fisher Scientific', date:'2026-07-23', timeCT:'7:30 AM', sess:'BMO', status:'confirmed', notes:'Source: Thermo Fisher Scientific press release (BusinessWire/ir.thermofisher.com), July 1, 2026' },
  { cat:'holdings', ticker:'GGG', co:'Graco', date:'2026-07-23', timeCT:'10:00 AM', sess:'', status:'confirmed', split:true, notes:'Conference call time shown. Results/press release come out after NYSE close on July 22. Source: Graco Inc. press release (businesswire.com), July 1, 2026' },
  { cat:'holdings', ticker:'GOOG', co:'Alphabet', date:'2026-07-22', timeCT:'3:30 PM', sess:'AMC', status:'confirmed', notes:'Conference call time shown (1:30 PM PT). Earnings release available before the call same day. Source: Alphabet press release (abc.xyz/investor), 2026' },
  { cat:'holdings', ticker:'MSFT', co:'Microsoft', date:'2026-07-29', timeCT:'4:30 PM', sess:'AMC', status:'confirmed', notes:'Webcast at 2:30 PM PT / 5:30 PM ET; results released after market close same day. Source: news.microsoft.com, July 8, 2026' },
  { cat:'holdings', ticker:'META', co:'Meta Platforms', date:'2026-07-29', timeCT:'3:30 PM', sess:'AMC', status:'confirmed', notes:'Q2 2026 Earnings Call at 1:30 PM PT / 4:30 PM ET; results released after market close same day. Source: investor.atmeta.com (Investor Events), July 2026' },
  { cat:'holdings', ticker:'AAPL', co:'Apple', date:'2026-07-30', timeCT:'4:00 PM', sess:'AMC', status:'confirmed', notes:'Conference call at 2:00 PM PT / 5:00 PM ET; results released after market close same day. Source: investor.apple.com (Investor Relations page), July 2026' },
  { cat:'holdings', ticker:'AMZN', co:'Amazon', date:'2026-07-30', timeCT:'4:00 PM', sess:'AMC', status:'confirmed', notes:'Conference call at 2:00 PM PT / 5:00 PM ET (after market close). Source: aboutamazon.com (Amazon official news), July 16, 2026' },
  { cat:'holdings', ticker:'RKT', co:'Rocket Companies', date:'2026-08-06', timeCT:'3:30 PM', sess:'AMC', status:'confirmed', notes:'Conference call at 4:30 PM ET (after market close); press release issued prior to the call. Source: Rocket Companies, Inc. press release (PR Newswire), July 23, 2026' },
  { cat:'holdings', ticker:'CPRT', co:'Copart', date:'', timeCT:'', sess:'', status:'not-announced', notes:'' },
  { cat:'holdings', ticker:'COST', co:'Costco', date:'2026-09-24', timeCT:'4:00 PM', sess:'AMC', status:'confirmed', notes:'Q4 2026 Earnings Call, conference call at 2:00 PM PT / 5:00 PM ET; results released after market close same day. Source: investor.costco.com (Events & Presentations), July 2026' },
  { cat:'holdings', ticker:'HEI', co:'HEICO', date:'2026-08-26', timeCT:'8:00 AM', sess:'BMO', status:'confirmed', split:true, notes:'Conference call time shown (9:00 AM ET, Wed Aug 26). Results/press release come out after the NYSE close on August 25. Source: HEICO Corporation press release (ACCESS Newswire), August 10, 2026' },
  { cat:'holdings', ticker:'SBUX', co:'Starbucks', date:'2026-07-29', timeCT:'3:15 PM', sess:'AMC', status:'confirmed', notes:'Conference call at 1:15 PM PT / 4:15 PM ET; results released after market close same day. Source: investor.starbucks.com press release, July 2026' },
  // BULLPEN
  { cat:'bullpen', ticker:'TSLA', co:'Tesla', date:'2026-07-22', timeCT:'4:30 PM', sess:'AMC', status:'confirmed', notes:'Source: Tesla, Inc. press release (SEC Form 8-K, Q2 2026 Production, Deliveries & Deployments), July 2026' },
  { cat:'bullpen', ticker:'UBER', co:'Uber', date:'2026-08-05', timeCT:'7:00 AM', sess:'BMO', status:'confirmed', notes:'Conference call at 5:00 AM PT / 8:00 AM ET (before market open). Source: investor.uber.com press release, July 2026' },
  { cat:'bullpen', ticker:'QXO', co:'QXO', date:'', timeCT:'', sess:'', status:'not-announced', notes:'' },
  { cat:'bullpen', ticker:'DASH', co:'DoorDash', date:'2026-08-05', timeCT:'3:30 PM', sess:'AMC', status:'confirmed', notes:'Conference call at 1:30 PM PT / 4:30 PM ET; results released after market close same day. Source: DoorDash press release (businesswire.com / ir.doordash.com), July 6, 2026' },
  { cat:'bullpen', ticker:'MELI', co:'MercadoLibre', date:'2026-08-05', timeCT:'4:00 PM', sess:'AMC', status:'confirmed', notes:'Conference call/video webcast at 5:00 PM ET (after market close). Source: MercadoLibre, Inc. press release (BusinessWire), July 29, 2026' },
  { cat:'bullpen', ticker:'FTNT', co:'Fortinet', date:'2026-07-29', timeCT:'3:30 PM', sess:'AMC', status:'confirmed', notes:'Source: Fortinet press release (investor.fortinet.com), June 24, 2026' },
  { cat:'bullpen', ticker:'SPCX', co:'SpaceX', date:'2026-08-04', timeCT:'3:30 PM', sess:'AMC', status:'confirmed', notes:'Results posted after market close; webcast/conference call at 4:30 PM ET / 3:30 PM CT same day. Source: SpaceX press release (ir.spacex.com), July 20, 2026' },
  { cat:'bullpen', ticker:'CRWD', co:'CrowdStrike', date:'2026-08-26', timeCT:'4:00 PM', sess:'AMC', status:'confirmed', notes:'Fiscal Q2 2027 results conference call at 2:00 PM PDT / 5:00 PM ET (after market close). Source: ir.crowdstrike.com (Events & Presentations, Upcoming Events), August 2026' },
  // WATCHLIST
  { cat:'watchlist', ticker:'JPM', co:'JPMorgan Chase', date:'2026-07-14', timeCT:'7:30 AM', sess:'BMO', status:'confirmed', notes:'Source: jpmorganchase.com, May 21, 2025' },
  { cat:'watchlist', ticker:'NFLX', co:'Netflix', date:'2026-07-16', timeCT:'3:45 PM', sess:'AMC', status:'confirmed', notes:'Source: ir.netflix.net, June 15, 2026' },
  { cat:'watchlist', ticker:'SCHW', co:'Charles Schwab', date:'', timeCT:'', sess:'', status:'not-announced', notes:'' },
  { cat:'watchlist', ticker:'AXP', co:'American Express', date:'2026-07-24', timeCT:'7:30 AM', sess:'BMO', status:'confirmed', notes:'Source: ir.americanexpress.com, December 19, 2025' },
  { cat:'watchlist', ticker:'ORLY', co:"O'Reilly Auto Parts", date:'2026-07-30', timeCT:'10:00 AM', sess:'', status:'confirmed', split:true, notes:'Conference call time shown. Results/press release come out after 3:30 PM CT on July 29. Source: O’Reilly Automotive press release (SEC 8-K/GlobeNewswire), July 1, 2026' },
  { cat:'watchlist', ticker:'BKNG', co:'Booking Holdings', date:'2026-08-04', timeCT:'3:30 PM', sess:'AMC', status:'confirmed', notes:'Conference call at 4:30 PM ET; results released ~4:00 PM ET same day. Source: Booking Holdings press release (PR Newswire), July 2026' },
  { cat:'watchlist', ticker:'ABNB', co:'Airbnb', date:'2026-08-06', timeCT:'4:00 PM', sess:'AMC', status:'confirmed', notes:'Conference call at 2:00 PM PT / 5:00 PM ET; results/shareholder letter released after market close same day. Source: Airbnb press release (SEC Form 8-K / investors.airbnb.com), July 2026' },
  { cat:'watchlist', ticker:'WMT', co:'Walmart', date:'2026-08-20', timeCT:'7:00 AM', sess:'BMO', status:'confirmed', notes:'Source: corporate.walmart.com, March 5, 2026' },
  { cat:'watchlist', ticker:'TJX', co:'TJX Companies', date:'2026-08-19', timeCT:'10:00 AM', sess:'', status:'confirmed', notes:'Q2 FY2027. Conference call time shown (11:00 AM ET). Results/press release come out the same morning before 8:30 AM CT. Source: The TJX Companies, Inc. press release (businesswire.com), August 5, 2026' },
  { cat:'watchlist', ticker:'FAST', co:'Fastenal', date:'2026-07-14', timeCT:'9:00 AM', sess:'', status:'confirmed', split:true, notes:'Conference call time shown (officially confirmed); results typically released the prior business day. Source: Fastenal Company press release (businesswire.com), June 26, 2026' },
];
const META = { lastUpdated: '2026-09-03', lastChanged: '2026-09-03' };

const TODAY=new Date();TODAY.setHours(0,0,0,0);
const STALE=new Date(TODAY.getTime()-7*24*60*60*1000);
function parseDate(d){if(!d)return null;const[y,m,day]=d.split('-').map(Number);return new Date(y,m-1,day);}
function isStale(dt){return dt&&dt<STALE;}
function sessHtml(s){if(s==='BMO')return'<span class="sess bmo">Before Open</span>';if(s==='AMC')return'<span class="sess amc">After Close</span>';return'';}
function fmtDate(d){return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
const catLabels={holdings:'h',watchlist:'w',bullpen:'b'};
const catNames={holdings:'Holdings',watchlist:'Bullpen',bullpen:"Z's BP"};
function fmtShort(d){return parseDate(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function buildPanel(cat){
  const rows=EARNINGS.filter(e=>e.cat===cat&&e.status==='confirmed').sort((a,b)=>parseDate(a.date)-parseDate(b.date)).filter(e=>!isStale(parseDate(e.date)));
  if(!rows.length)return'<div class="empty-panel">No confirmed dates yet</div>';
  return rows.map(e=>`<div class="entry"><div class="entry-ticker">${e.ticker}${e.split?'*':''}${e.isNew?'<span class="new-badge">New</span>':''}</div><div class="entry-company">${e.co}</div><div class="entry-row"><span class="entry-date">${fmtDate(parseDate(e.date))}</span><span class="entry-time">${e.timeCT} CT</span>${sessHtml(e.sess)}</div>${e.notes?`<div class="entry-notes">${e.notes}</div>`:''}</div>`).join('');
}
function buildNA(){
  const order=['holdings','watchlist','bullpen'];
  return order.flatMap(cat=>EARNINGS.filter(e=>e.cat===cat&&(e.status==='not-announced'||(e.status==='confirmed'&&isStale(parseDate(e.date))))).sort((a,b)=>a.ticker.localeCompare(b.ticker)).map(e=>`<div class="na-chip"><div class="sym">${e.ticker}</div><div class="co">${e.co}</div><div class="cat ${catLabels[cat]}">${catNames[cat]}</div></div>`)).join('');
}
document.getElementById('holdingsBody').innerHTML=buildPanel('holdings');
document.getElementById('watchlistBody').innerHTML=buildPanel('watchlist');
document.getElementById('bullpenBody').innerHTML=buildPanel('bullpen');
document.getElementById('naGrid').innerHTML=buildNA();
document.getElementById('updatedBadge').textContent='Updated: '+fmtShort(META.lastUpdated);

let calMonth=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function calEventsByDate(){
  const map={};
  EARNINGS.filter(e=>e.status==='confirmed'&&e.date).forEach(e=>{
    (map[e.date]||(map[e.date]=[])).push(e);
  });
  return map;
}
function renderCalendar(){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  document.getElementById('calMonthLabel').textContent=calMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const startDow=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const daysInPrev=new Date(y,m,0).getDate();
  const totalCells=Math.ceil((startDow+daysInMonth)/7)*7;
  const events=calEventsByDate();
  const tY=TODAY.getFullYear(), tM=TODAY.getMonth(), tD=TODAY.getDate();
  const dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let html=dows.map(d=>'<div class="cal-dow">'+d+'</div>').join('');
  for(let i=0;i<totalCells;i++){
    const off=i-startDow;
    let cellDate, muted, dayNum;
    if(off<0){dayNum=daysInPrev+off+1;cellDate=new Date(y,m-1,dayNum);muted=true;}
    else if(off>=daysInMonth){dayNum=off-daysInMonth+1;cellDate=new Date(y,m+1,dayNum);muted=true;}
    else {dayNum=off+1;cellDate=new Date(y,m,dayNum);muted=false;}
    const key=dateKey(cellDate);
    const isToday=cellDate.getFullYear()===tY&&cellDate.getMonth()===tM&&cellDate.getDate()===tD;
    const evHtml=(events[key]||[]).map(e=>'<div class="cal-event '+e.cat+'" title="'+e.ticker+(e.split?'*':'')+' '+e.timeCT+' CT"><span class="t">'+e.ticker+(e.split?'*':'')+'</span><span class="tm">'+e.timeCT+'</span></div>').join('');
    html+='<div class="cal-cell'+(muted?' muted':'')+(isToday?' today':'')+'"><div class="cal-daynum">'+dayNum+'</div>'+evHtml+'</div>';
  }
  document.getElementById('calGrid').innerHTML=html;
}
function setView(v){
  const isCal=v==='calendar';
  document.getElementById('listView').hidden=isCal;
  document.getElementById('calendarView').hidden=!isCal;
  document.getElementById('listViewBtn').classList.toggle('active',!isCal);
  document.getElementById('calViewBtn').classList.toggle('active',isCal);
  try{localStorage.setItem('earningsViewV2',isCal?'calendar':'list');}catch(err){}
  if(isCal) renderCalendar();
}
document.getElementById('listViewBtn').addEventListener('click',()=>setView('list'));
document.getElementById('calViewBtn').addEventListener('click',()=>setView('calendar'));
document.getElementById('calPrev').addEventListener('click',()=>{calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);renderCalendar();});
document.getElementById('calNext').addEventListener('click',()=>{calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);renderCalendar();});
document.getElementById('calToday').addEventListener('click',()=>{calMonth=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);renderCalendar();});
let savedView='calendar';
try{savedView=localStorage.getItem('earningsViewV2')||'calendar';}catch(err){}
setView(savedView==='list'?'list':'calendar');

function loadExcelJS(){
  if(window.ExcelJS) return Promise.resolve();
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    s.onload=resolve; s.onerror=()=>reject(new Error('exceljs'));
    document.head.appendChild(s);
  });
}
async function exportChecklist(){
  const btn=document.getElementById('exportBtn');
  const originalLabel=btn.textContent;
  btn.disabled=true;btn.textContent='Generating…';
  try{
    await loadExcelJS();
    const CATS=[{key:'holdings',label:'Holdings'},{key:'watchlist',label:'Bullpen'},{key:'bullpen',label:"Zane's Bullpen"}];

    const wb=new ExcelJS.Workbook();
    const ws=wb.addWorksheet('Checklist');
    ws.columns=[{width:12},{width:16},{width:12},{width:12}];

    const now=new Date();
    const createdStr='Created: '+now.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+' at '+now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    const createdCell=ws.getCell('A1');
    createdCell.value=createdStr;
    createdCell.font={size:7,italic:true,color:{argb:'FF94A3B8'}};
    ws.mergeCells('A1:D1');

    const headerRow=ws.getRow(3);
    headerRow.values=['Ticker','Date','Time','Listened'];
    headerRow.eachCell(c=>{c.font={bold:true};c.alignment={vertical:'middle',horizontal:'center'};c.border={bottom:{style:'thin'}};});

    let rowNum=4;
    CATS.forEach(({key,label})=>{
      const confirmedRows=EARNINGS.filter(e=>e.cat===key&&e.status==='confirmed'&&!isStale(parseDate(e.date))).sort((a,b)=>parseDate(a.date)-parseDate(b.date));
      const naRows=EARNINGS.filter(e=>e.cat===key&&e.status==='not-announced').sort((a,b)=>a.ticker.localeCompare(b.ticker));
      const rows=[...confirmedRows,...naRows];
      if(!rows.length)return;

      const secRow=ws.getRow(rowNum);
      ws.mergeCells(rowNum,1,rowNum,4);
      const secCell=secRow.getCell(1);
      secCell.value=label;
      secCell.font={bold:true,size:10,color:{argb:'FF1A2332'}};
      secCell.alignment={vertical:'middle',horizontal:'left'};
      secCell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF1F5F9'}};
      secRow.height=18;
      rowNum++;

      rows.forEach(e=>{
        const r=ws.getRow(rowNum);
        r.getCell(1).value=e.ticker;
        r.getCell(2).value=e.date?fmtDate(parseDate(e.date)):'';
        r.getCell(3).value=e.timeCT?(e.timeCT+' CT'):'';
        r.getCell(4).value='';
        r.eachCell({includeEmpty:true},c=>{c.alignment={vertical:'middle',horizontal:'center'};c.border={top:{style:'thin',color:{argb:'FFE8EDF2'}},bottom:{style:'thin',color:{argb:'FFE8EDF2'}},left:{style:'thin',color:{argb:'FFE8EDF2'}},right:{style:'thin',color:{argb:'FFE8EDF2'}}};});
        r.getCell(4).border={top:{style:'thin',color:{argb:'FF94A3B8'}},bottom:{style:'thin',color:{argb:'FF94A3B8'}},left:{style:'thin',color:{argb:'FF94A3B8'}},right:{style:'thin',color:{argb:'FF94A3B8'}}};
        r.height=20;
        rowNum++;
      });

      rowNum++;
    });

    const buffer=await wb.xlsx.writeBuffer();
    const blob=new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='earnings-checklist-'+now.toISOString().slice(0,10)+'.xlsx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(err){
    console.error(err);
    alert('Could not generate the checklist file. Please try again.');
  }finally{
    btn.disabled=false;btn.textContent=originalLabel;
  }
}
</script>
